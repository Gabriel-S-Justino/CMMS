# ============================================================
# CMMS — Produção Web
# ============================================================
# Frontend:
# Expo Web → Nginx
#
# Backend:
# FastAPI
#
# Banco:
# PostgreSQL
# ============================================================

services:

  frontend:
    build:
      context: ./frontend

      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8080/api/v1}

    container_name: cmms-frontend
    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "${FRONTEND_PORT:-8081}:80"


  api:
    ports:
      - "${API_PORT:-8080}:8000"

    environment:
      DEBUG: "false"

      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}


# ============================================================
# CMMS — Docker Compose Base
# ============================================================
# Infraestrutura compartilhada pelos ambientes.
#
# Desenvolvimento:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Produção:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: cmms-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cmms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-cmms}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-cmms} -d ${POSTGRES_DB:-cmms}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  api:
    build:
      context: ./backend

    container_name: cmms-api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cmms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cmms}

      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}

      DEBUG: ${DEBUG:-false}

      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}

      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cmms.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no .env}

      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-superadmin@cmms.local}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?defina SUPERADMIN_PASSWORD no .env}

      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-}

    volumes:
      - uploads_data:/app/uploads

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:8000/api/v1/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


volumes:
  postgres_data:
  uploads_data:
